# nfpm config for the .deb and .rpm packages; run by packaging/linux/build-packages.sh,
# which sets VERSION, ARCH and PUBLISH_DIR.
name: hermes
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: hunterlan <hunterlan@users.noreply.github.com>
description: |
  Native, Postman-style desktop client for testing REST APIs.
vendor: hunterlan
homepage: https://github.com/hunterlan/Hermes
license: Proprietary

contents:
  - src: ${PUBLISH_DIR}/
    dst: /opt/hermes/
    type: tree
  - src: /opt/hermes/Hermes
    dst: /usr/bin/hermes
    type: symlink
  - src: packaging/linux/hermes.desktop
    dst: /usr/share/applications/hermes.desktop
  - src: packaging/icons/hermes.svg
    dst: /usr/share/icons/hicolor/scalable/apps/hermes.svg
  - src: packaging/icons/png/hermes-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/hermes.png
  - src: packaging/icons/png/hermes-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/hermes.png
  - src: packaging/icons/png/hermes-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/hermes.png

# The app is self-contained; these are the native libraries .NET and Avalonia load from the system.
# libsecret is only a recommendation: without it secrets fall back to plain text (see README).
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libssl3 | libssl3t64
      - libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
    recommends:
      - libsecret-1-0
  rpm:
    depends:
      - glibc
      - libgcc
      - libstdc++
      - zlib
      - openssl-libs
      - libicu
      - fontconfig
      - libX11
      - libICE
      - libSM
    recommends:
      - libsecret
